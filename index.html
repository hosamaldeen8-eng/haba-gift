<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>هبّة للعطور — هدية الافتتاح</title>
<meta name="theme-color" content="#231308">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Ccircle cx='16' cy='16' r='16' fill='%233A2618'/%3E%3Crect x='11' y='10' width='10' height='14' rx='2.5' fill='%23F2E6D2'/%3E%3Crect x='13.5' y='6' width='5' height='4' rx='1' fill='%23CBA66B'/%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Aref+Ruqaa:wght@400;700&family=IBM+Plex+Sans+Arabic:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root{
    --brown:#3A2618;
    --brown-deep:#231308;
    --brown-soft:#4A3222;
    --cream:#F2E6D2;
    --cream-dim:#D9C8AE;
    --gold:#CBA66B;
    --gold-dim:#8F7148;
    --ok:#9DBB8A;
  }
  *{box-sizing:border-box;margin:0;padding:0}
  html,body{height:100%}
  body{
    font-family:"IBM Plex Sans Arabic",system-ui,sans-serif;
    color:var(--cream);
    background:
      radial-gradient(120% 70% at 50% 0%, var(--brown-soft) 0%, var(--brown) 45%, var(--brown-deep) 100%);
    min-height:100dvh;
    display:grid;
    place-items:center;
    padding:24px 16px calc(24px + env(safe-area-inset-bottom));
    -webkit-font-smoothing:antialiased;
  }

  .card{
    width:100%;
    max-width:420px;
    position:relative;
    padding:14px;
    border:1px solid var(--gold);
    background:var(--brown);
  }
  .card::before{
    content:"";
    position:absolute; inset:7px;
    border:1px dashed var(--gold-dim);
    pointer-events:none;
  }
  .inner{
    position:relative;
    padding:40px 26px 34px;
    text-align:center;
  }

  .mark{display:flex;flex-direction:column;align-items:center;gap:10px}
  .mark svg{width:64px;height:64px;display:block}
  .brand{
    font-family:"Aref Ruqaa",serif;
    font-size:44px;
    line-height:1;
    color:var(--cream);
  }
  .brand-latin{
    font-family:"IBM Plex Sans Arabic",sans-serif;
    font-size:11px;
    letter-spacing:.32em;
    color:var(--gold);
    margin-top:2px;
    direction:ltr;
  }

  hr{
    border:0;
    width:72px;
    height:1px;
    background:var(--gold-dim);
    margin:28px auto 26px;
  }

  h1{
    font-family:"Aref Ruqaa",serif;
    font-weight:400;
    font-size:38px;
    line-height:1.25;
    color:var(--cream);
    margin-bottom:14px;
  }
  p.lead{
    font-size:17px;
    line-height:1.85;
    color:var(--cream-dim);
    max-width:32ch;
    margin:0 auto 30px;
  }
  p.lead b{color:var(--cream);font-weight:600}

  .btn{
    appearance:none;
    width:100%;
    border:1px solid var(--gold);
    background:var(--gold);
    color:var(--brown-deep);
    font:600 18px/1 "IBM Plex Sans Arabic",sans-serif;
    padding:17px 20px;
    cursor:pointer;
    transition:background .15s, transform .08s;
  }
  .btn:hover{background:#D7B67E}
  .btn:active{transform:translateY(1px)}
  .btn:focus-visible{outline:2px solid var(--cream);outline-offset:3px}
  .btn[disabled]{opacity:.7;cursor:default}

  .note{
    margin-top:18px;
    font-size:13px;
    color:var(--gold-dim);
    line-height:1.7;
  }

  /* success state */
  .done{display:none}
  .card.is-done .ask{display:none}
  .card.is-done .done{display:block}

  .check{
    width:58px;height:58px;
    margin:0 auto 18px;
    border-radius:50%;
    border:1px solid var(--gold);
    display:grid;place-items:center;
  }
  .check svg{width:26px;height:26px}
  .done h1{font-size:34px;margin-bottom:6px}
  .ticket{
    margin:22px auto 0;
    max-width:260px;
    border-top:1px dashed var(--gold-dim);
    border-bottom:1px dashed var(--gold-dim);
    padding:16px 0;
  }
  .ticket .label{font-size:13px;color:var(--gold);margin-bottom:6px}
  .ticket .num{
    font-family:"Aref Ruqaa",serif;
    font-size:40px;line-height:1.2;color:var(--cream);
  }
  .done p.lead{margin-top:18px;margin-bottom:0}

  .foot{
    margin-top:26px;
    font-size:12px;
    letter-spacing:.18em;
    color:var(--gold-dim);
    direction:ltr;
  }

  @media (prefers-reduced-motion:no-preference){
    .card.is-done .done{animation:rise .35s ease-out}
    @keyframes rise{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
  }
  @media (max-width:360px){
    h1{font-size:33px}
    .brand{font-size:40px}
  }
</style>
</head>
<body>

<main class="card" id="card">
  <div class="inner">

    <div class="mark" aria-hidden="true">
      <svg viewBox="0 0 64 64" fill="none">
        <path d="M6 28c4 0 4-3 8-3s4 3 8 3" stroke="#CBA66B" stroke-width="1.6" stroke-linecap="round"/>
        <path d="M6 36c4 0 4-3 8-3s4 3 8 3" stroke="#CBA66B" stroke-width="1.6" stroke-linecap="round"/>
        <path d="M42 28c4 0 4-3 8-3s4 3 8 3" stroke="#CBA66B" stroke-width="1.6" stroke-linecap="round"/>
        <path d="M42 36c4 0 4-3 8-3s4 3 8 3" stroke="#CBA66B" stroke-width="1.6" stroke-linecap="round"/>
        <rect x="27" y="8" width="10" height="8" rx="1.5" fill="#CBA66B"/>
        <rect x="21" y="16" width="22" height="30" rx="4" fill="#F2E6D2"/>
        <path d="M32 26l4 5-4 5-4-5z" fill="#3A2618"/>
      </svg>
      <div class="brand">هبّة</div>
      <div class="brand-latin">HABBA PERFUMES</div>
    </div>

    <hr>

    <!-- ask state -->
    <section class="ask">
      <h1>هدية الافتتاح</h1>
      <p class="lead">
        بمناسبة افتتاح متجر هبّة للعطور، <b>سجّى</b> تهديكم كرت هدية خاص بيوم الافتتاح.
        احجز كرتك الآن، وادعمنا بالمتابعة.
      </p>
      <button class="btn" id="claim" type="button">احجز كرتك</button>
      <p class="note">الكروت محدودة لأول الحاضرين</p>
    </section>

    <!-- done state -->
    <section class="done" aria-live="polite">
      <div class="check" aria-hidden="true">
        <svg viewBox="0 0 24 24" fill="none"><path d="M5 12.5l4.5 4.5L19 7.5" stroke="#CBA66B" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg>
      </div>
      <h1>تم تسجيلك</h1>
      <div class="ticket">
        <div class="label">السحب على الكروت</div>
        <div class="num">انتظر السحب</div>
      </div>
      <p class="lead">سجّى بتعلن أسماء الفائزين بعد قليل.<br>شكراً لدعمكم في يوم الافتتاح.</p>
    </section>

    <div class="foot">@haba_perfumes</div>
  </div>
</main>

<script>
(function(){
  var URL  = "https://fwqmudtivzushmvpspty.supabase.co/rest/v1/haba_demo_scans";
  var KEY  = "sb_publishable_MRM5OjY17NkhaF4mGEmU-A_tQikiP-4";
  var card = document.getElementById("card");
  var btn  = document.getElementById("claim");
  var LS   = "haba_card";

  function show(){
    card.classList.add("is-done");
    window.scrollTo(0,0);
  }

  // already registered on this phone -> show the same card again
  try{
    var saved = localStorage.getItem(LS);
    if(saved){ show(); }
  }catch(e){}

  btn.addEventListener("click", function(){
    btn.disabled = true;
    btn.textContent = "لحظة...";
    fetch(URL,{
      method:"POST",
      headers:{
        "apikey":KEY,
        "Authorization":"Bearer "+KEY,
        "Content-Type":"application/json",
        "Prefer":"return=representation"
      },
      body:"{}"
    })
    .then(function(r){ return r.ok ? r.json() : Promise.reject(r.status); })
    .then(function(rows){
      try{ localStorage.setItem(LS, "1"); }catch(e){}
      show();
    })
    .catch(function(){
      btn.disabled = false;
      btn.textContent = "حاول مرة أخرى";
    });
  });
})();
</script>
</body>
</html>
